# fly.toml app configuration file generated for pubg-bot-bakqpq on 2026-11-21T22:50:48Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'pubg-bot-bakqpq'
primary_region = 'iad'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
